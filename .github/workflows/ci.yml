name: SendIt CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sendit_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov httpx fastapi uvicorn sqlmodel psycopg2-binary alembic python-dotenv aiofiles slowapi "passlib[bcrypt]" "python-jose[cryptography]" psutil

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sendit_test_db
          SECRET_KEY: test_secret_key_for_ci
        run: |
          pytest tests/ -v
