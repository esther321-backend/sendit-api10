name: SendIt API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system fastapi uvicorn sqlmodel psycopg2-binary alembic python-dotenv httpx aiofiles slowapi "passlib[bcrypt]==1.7.4" "bcrypt==4.0.1" "python-multipart>=0.0.32" "python-jose[cryptography]" psutil pytest pytest-cov

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest
