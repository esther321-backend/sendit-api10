cat << 'EOF' > .github/workflows/ci.yml
name: SendIt API CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system fastapi uvicorn sqlmodel psycopg2-binary alembic python-dotenv httpx aiofiles slowapi "passlib[bcrypt]" "python-jose[cryptography]" psutil pytest pytest-cov python-multipart

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v
EOF
